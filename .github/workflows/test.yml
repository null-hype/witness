name: test

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - name: Build witness
        run: go build -o "$RUNNER_TEMP/witness" .
      - name: Neovim receives the recorded finding and evidence locations
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz | tar xz -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/nvim-linux-x86_64/bin:$RUNNER_TEMP:$PATH"
          nvim --headless --clean \
            -c "lua vim.g.witness_lsp_cmd = '$RUNNER_TEMP/witness'" \
            -c "luafile nvim/witness.lua" \
            -c "edit example/example.ts" \
            -c "luafile nvim/check.lua"
